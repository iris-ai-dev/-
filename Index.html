<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris AI Camera & Detection 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .vision-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            border: 3px solid #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #startBtn {
            margin-top: 20px;
            padding: 16px 32px;
            font-size: 18px;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }
        #startBtn:hover { transform: scale(1.08); }
    </style>
</head>
<body>

    <h2>🌸 IRIS INTELLIGENCE VISION 2026</h2>
    
    <div class="vision-container">
        <video id="irisWebcam" autoplay playsinline muted></video>
        <canvas id="irisOverlay"></canvas>
    </div>

    <button id="startBtn">📷 เปิดกล้องหลัง - ตรวจจับทุกอย่าง</button>

    <div id="ui-panel" style="margin-top: 15px; background: rgba(0,255,136,0.08); padding: 12px 25px; border-radius: 8px; min-width: 320px;">
        <span id="dot" class="status-dot"></span>
        <span id="statusText">พร้อมใช้งาน</span>
        <div id="count" style="margin-top: 8px; font-size: 15px; color: #00ffcc;"></div>
    </div>

    <script>
        const video = document.getElementById('irisWebcam');
        const canvas = document.getElementById('irisOverlay');
        const statusText = document.getElementById('statusText');
        const dot = document.getElementById('dot');
        const countDisplay = document.getElementById('count');
        const startBtn = document.getElementById('startBtn');
        const context = canvas.getContext('2d');

        let objectDetector = null;
        let isRunning = false;
        let videoWidth, videoHeight;

        async function loadModel() {
            statusText.textContent = "กำลังโหลดโมเดล AI...";
            objectDetector = await cocoSsd.load();
            statusText.textContent = "โหลดโมเดลสำเร็จ ✓";
            return true;
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                
                video.srcObject = stream;
                
                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        videoWidth = video.videoWidth;
                        videoHeight = video.videoHeight;
                        
                        // ตั้งขนาด canvas ให้ตรงกับวิดีโอจริง
                        canvas.width = videoWidth;
                        canvas.height = videoHeight;
                        
                        resolve(true);
                    };
                });
            } catch (err) {
                statusText.textContent = "เปิดกล้องไม่ได้";
                statusText.style.color = "#ff4444";
                return false;
            }
        }

        async function runDetection() {
            if (!objectDetector || !isRunning) return;

            try {
                const predictions = await objectDetector.detect(video, 0.25);
                
                context.clearRect(0, 0, canvas.width, canvas.height);

                predictions.forEach(prediction => {
                    const [x, y, width, height] = prediction.bbox;
                    const score = Math.round(prediction.score * 100);
                    const label = prediction.class.toUpperCase();

                    // กรอบสวย
                    context.shadowColor = "#00ff88";
                    context.shadowBlur = 20;
                    context.strokeStyle = "#00ff88";
                    context.lineWidth = 5;
                    context.strokeRect(x, y, width, height);

                    // ป้าย
                    const text = `${label} ${score}%`;
                    context.font = "bold 17px Arial";
                    const textWidth = context.measureText(text).width;

                    const gradient = context.createLinearGradient(x, y-40, x, y-5);
                    gradient.addColorStop(0, "rgba(0, 255, 136, 0.95)");
                    gradient.addColorStop(1, "rgba(0, 180, 90, 0.95)");

                    context.fillStyle = gradient;
                    context.fillRect(x - 3, y - 40, textWidth + 20, 35);

                    context.shadowBlur = 0;
                    context.fillStyle = "#000";
                    context.fillText(text, x + 8, y - 15);
                });

                countDisplay.textContent = `ตรวจพบ ${predictions.length} วัตถุ`;
            } catch (e) {}

            requestAnimationFrame(runDetection);
        }

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            await loadModel();
            const ok = await startCamera();
            if (ok) {
                dot.classList.add('active');
                statusText.textContent = "ระบบตรวจจับทุกอย่าง - กำลังทำงาน";
                isRunning = true;
                runDetection();
            }
        });
    </script>
</body>
</html>
