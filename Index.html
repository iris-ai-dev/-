<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris AI Camera & Detection 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .vision-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            border: 3px solid #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #startBtn {
            margin-top: 20px;
            padding: 16px 32px;
            font-size: 18px;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🌸 IRIS INTELLIGENCE VISION 2026</h2>
    
    <div class="vision-container">
        <video id="irisWebcam" autoplay playsinline muted></video>
        <canvas id="irisOverlay"></canvas>
    </div>

    <button id="startBtn">📷 เปิดกล้องหลัง - ตรวจจับ 20 วัตถุ</button>

    <div id="ui-panel" style="margin-top: 15px; background: rgba(0,255,136,0.08); padding: 12px 25px; border-radius: 8px; min-width: 320px;">
        <span id="dot" class="status-dot"></span>
        <span id="statusText">พร้อมใช้งาน</span>
        <div id="count" style="margin-top: 8px; font-size: 15px; color: #00ffcc;"></div>
    </div>

    <script>
        // แปลงชื่ออังกฤษเป็นไทย
        const thaiLabels = {
            "person": "คน",
            "bicycle": "จักรยาน",
            "car": "รถยนต์",
            "motorcycle": "มอเตอร์ไซค์",
            "airplane": "เครื่องบิน",
            "bus": "รถบัส",
            "train": "รถไฟ",
            "truck": "รถบรรทุก",
            "boat": "เรือ",
            "traffic light": "ไฟจราจร",
            "fire hydrant": "หัวดับเพลิง",
            "stop sign": "ป้ายหยุด",
            "parking meter": "มิเตอร์จอดรถ",
            "bench": "ม้านั่ง",
            "bird": "นก",
            "cat": "แมว",
            "dog": "สุนัข",
            "horse": "ม้า",
            "sheep": "แกะ",
            "cow": "วัว",
            "elephant": "ช้าง",
            "bear": "หมี",
            "zebra": "ม้าลาย",
            "giraffe": "ยีราฟ",
            "backpack": "เป้สะพายหลัง",
            "umbrella": "ร่ม",
            "handbag": "กระเป๋าถือ",
            "tie": "เนคไท",
            "suitcase": "กระเป๋าเดินทาง",
            "frisbee": "จานบิน",
            "skis": "สกี",
            "snowboard": "สโนว์บอร์ด",
            "sports ball": "ลูกบอล",
            "kite": "ว่าว",
            "baseball bat": "ไม้เบสบอล",
            "baseball glove": "ถุงมือเบสบอล",
            "skateboard": "สเก็ตบอร์ด",
            "surfboard": "กระดานโต้คลื่น",
            "tennis racket": "ไม้เทนนิส",
            "bottle": "ขวด",
            "wine glass": "แก้วไวน์",
            "cup": "แก้ว",
            "fork": "ส้อม",
            "knife": "มีด",
            "spoon": "ช้อน",
            "bowl": "ชาม",
            "banana": "กล้วย",
            "apple": "แอปเปิ้ล",
            "sandwich": "แซนด์วิช",
            "orange": "ส้ม",
            "broccoli": "บรอกโคลี",
            "carrot": "แคร์รอต",
            "hot dog": "ฮอตด็อก",
            "pizza": "พิซซ่า",
            "donut": "โดนัท",
            "cake": "เค้ก",
            "chair": "เก้าอี้",
            "couch": "โซฟา",
            "potted plant": "ต้นไม้กระถาง",
            "bed": "เตียง",
            "dining table": "โต๊ะอาหาร",
            "toilet": "โถส้วม",
            "tv": "ทีวี",
            "laptop": "แล็ปท็อป",
            "mouse": "เมาส์",
            "remote": "รีโมท",
            "keyboard": "คีย์บอร์ด",
            "cell phone": "โทรศัพท์",
            "microwave": "ไมโครเวฟ",
            "oven": "เตาอบ",
            "toaster": "เครื่องปิ้งขนมปัง",
            "sink": "อ่างล้างจาน",
            "refrigerator": "ตู้เย็น",
            "book": "หนังสือ",
            "clock": "นาฬิกา",
            "vase": "แจกัน",
            "scissors": "กรรไกร",
            "teddy bear": "ตุ๊กตาหมี",
            "hair drier": "ไดร์เป่าผม",
            "toothbrush": "แปรงสีฟัน"
        };

        const video = document.getElementById('irisWebcam');
        const canvas = document.getElementById('irisOverlay');
        const statusText = document.getElementById('statusText');
        const dot = document.getElementById('dot');
        const countDisplay = document.getElementById('count');
        const startBtn = document.getElementById('startBtn');
        const context = canvas.getContext('2d');

        let objectDetector = null;
        let isRunning = false;

        async function loadModel() {
            statusText.textContent = "กำลังโหลดโมเดล AI...";
            objectDetector = await cocoSsd.load();
            statusText.textContent = "โหลดโมเดลสำเร็จ ✓";
            return true;
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 480 },   // ลดความละเอียดเพื่อให้เร็วขึ้น
                        height: { ideal: 360 }
                    }
                });
                
                video.srcObject = stream;
                
                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve(true);
                    };
                });
            } catch (err) {
                statusText.textContent = "เปิดกล้องไม่ได้";
                statusText.style.color = "#ff4444";
                return false;
            }
        }

        async function runDetection() {
            if (!objectDetector || !isRunning) return;

            try {
                // ตรวจจับสูงสุด 20 วัตถุ
                let predictions = await objectDetector.detect(video, 0.25);
                predictions = predictions.slice(0, 20);   // จำกัดที่ 20 ตัว

                context.clearRect(0, 0, canvas.width, canvas.height);

                predictions.forEach(prediction => {
                    const [x, y, width, height] = prediction.bbox;
                    const score = Math.round(prediction.score * 100);
                    const engLabel = prediction.class;
                    const thaiLabel = thaiLabels[engLabel] || engLabel.toUpperCase();

                    // กรอบ
                    context.shadowColor = "#00ff88";
                    context.shadowBlur = 15;
                    context.strokeStyle = "#00ff88";
                    context.lineWidth = 4;
                    context.strokeRect(x, y, width, height);

                    // ป้ายภาษาไทย
                    const text = `${thaiLabel} ${score}%`;
                    context.font = "bold 17px Arial";
                    const textWidth = context.measureText(text).width;

                    const gradient = context.createLinearGradient(x, y-38, x, y-5);
                    gradient.addColorStop(0, "rgba(0, 255, 136, 0.95)");
                    gradient.addColorStop(1, "rgba(0, 180, 90, 0.95)");

                    context.fillStyle = gradient;
                    context.fillRect(x - 3, y - 38, textWidth + 20, 34);

                    context.shadowBlur = 0;
                    context.fillStyle = "#000";
                    context.fillText(text, x + 8, y - 13);
                });

                countDisplay.textContent = `ตรวจพบ ${predictions.length} วัตถุ`;
            } catch (e) {}

            requestAnimationFrame(runDetection);
        }

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            await loadModel();
            const ok = await startCamera();
            if (ok) {
                dot.classList.add('active');
                statusText.textContent = "ตรวจจับ 20 วัตถุ - กำลังทำงาน";
                isRunning = true;
                runDetection();
            }
        });
    </script>
</body>
</html>
