<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris AI Camera & Detection 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .vision-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            border: 3px solid #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #startBtn {
            margin-top: 20px;
            padding: 16px 32px;
            font-size: 18px;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🌸 IRIS INTELLIGENCE VISION 2026</h2>
    
    <div class="vision-container">
        <video id="irisWebcam" autoplay playsinline muted></video>
        <canvas id="irisOverlay"></canvas>
    </div>

    <button id="startBtn">📷 เปิดกล้องหลัง - 60 FPS</button>

    <div id="ui-panel" style="margin-top: 15px; background: rgba(0,255,136,0.08); padding: 12px 25px; border-radius: 8px; min-width: 320px;">
        <span id="dot" class="status-dot"></span>
        <span id="statusText">พร้อมใช้งาน</span>
        <div id="count" style="margin-top: 8px; font-size: 15px; color: #00ffcc;"></div>
    </div>

    <script>
        const thaiLabels = {
            "person": "คน", "bicycle": "จักรยาน", "car": "รถยนต์", "motorcycle": "มอเตอร์ไซค์",
            "bus": "รถบัส", "truck": "รถบรรทุก", "bottle": "ขวดน้ำ", "cup": "แก้ว",
            "chair": "เก้าอี้", "table": "โต๊ะ", "tv": "ทีวี", "laptop": "แล็ปท็อป",
            "cell phone": "โทรศัพท์", "book": "หนังสือ", "clock": "นาฬิกา",
            // ... (เพิ่มได้เรื่อยๆ)
        };

        const video = document.getElementById('irisWebcam');
        const canvas = document.getElementById('irisOverlay');
        const statusText = document.getElementById('statusText');
        const countDisplay = document.getElementById('count');
        const startBtn = document.getElementById('startBtn');
        const context = canvas.getContext('2d', { alpha: true });

        let objectDetector = null;
        let isRunning = false;
        let frameSkip = 0;

        async function loadModel() {
            statusText.textContent = "กำลังโหลดโมเดล AI...";
            objectDetector = await cocoSsd.load();
            statusText.textContent = "โหลดโมเดลสำเร็จ ✓";
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                video.srcObject = stream;

                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        // ทำให้ canvas ตรงกับขนาดที่แสดงผลจริง
                        const displayWidth = video.offsetWidth || 640;
                        const displayHeight = video.offsetHeight || 480;
                        
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        canvas.style.width = displayWidth + 'px';
                        canvas.style.height = displayHeight + 'px';
                        
                        resolve(true);
                    };
                });
            } catch (err) {
                statusText.textContent = "เปิดกล้องไม่ได้";
                statusText.style.color = "#ff4444";
                return false;
            }
        }

        async function runDetection() {
            if (!objectDetector || !isRunning) return;

            frameSkip++;
            if (frameSkip % 2 === 0) {  // ตรวจจับทุก 2 เฟรม เพื่อความลื่น 60fps
                try {
                    const predictions = await objectDetector.detect(video, 0.15);
                    
                    context.clearRect(0, 0, canvas.width, canvas.height);

                    predictions.forEach(prediction => {
                        const [x, y, width, height] = prediction.bbox;
                        const score = Math.round(prediction.score * 100);
                        const thai = thaiLabels[prediction.class] || prediction.class.toUpperCase();

                        // กรอบละเอียด
                        context.shadowColor = "#00ff88";
                        context.shadowBlur = 20;
                        context.strokeStyle = "#00ff88";
                        context.lineWidth = 4.5;
                        context.strokeRect(x, y, width, height);

                        // ป้าย
                        const text = `${thai} ${score}%`;
                        context.font = "bold 17px Arial";
                        const tw = context.measureText(text).width;

                        const grad = context.createLinearGradient(x, y-40, x, y-8);
                        grad.addColorStop(0, "rgba(0,255,136,0.95)");
                        grad.addColorStop(1, "rgba(0,200,100,0.95)");

                        context.fillStyle = grad;
                        context.fillRect(x-4, y-40, tw+24, 34);

                        context.fillStyle = "#000";
                        context.fillText(text, x+8, y-15);
                    });

                    countDisplay.textContent = `ตรวจพบ ${predictions.length} วัตถุ`;
                } catch (e) {}
            }

            requestAnimationFrame(runDetection);
        }

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            await loadModel();
            const ok = await startCamera();
            if (ok) {
                isRunning = true;
                statusText.textContent = "ทำงานที่ 60 FPS - ตรวจจับละเอียด";
                runDetection();
            }
        });
    </script>
</body>
</html>
