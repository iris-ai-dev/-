<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris AI Camera & Detection 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .vision-container {
            position: relative;
            border: 3px solid #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        video, canvas { display: block; }
        
        #startBtn {
            margin-top: 20px;
            padding: 16px 32px;
            font-size: 18px;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }
        #startBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
        }
        #ui-panel {
            margin-top: 15px;
            background: rgba(0, 255, 136, 0.08);
            padding: 12px 25px;
            border-radius: 8px;
            min-width: 340px;
        }
        .status-dot {
            height: 13px; width: 13px;
            background-color: #ff0000;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px #ff0000;
        }
        .active { background-color: #00ff88; box-shadow: 0 0 12px #00ff88; }
    </style>
</head>
<body>

    <h2>🌸 IRIS INTELLIGENCE VISION 2026</h2>
    
    <div class="vision-container">
        <video id="irisWebcam" autoplay playsinline muted width="640" height="480"></video>
        <canvas id="irisOverlay"></canvas>
    </div>

    <button id="startBtn">📷 เปิดกล้องหลัง - ตรวจจับทุกอย่าง</button>

    <div id="ui-panel">
        <span id="dot" class="status-dot"></span>
        <span id="statusText">พร้อมใช้งาน - กล้องหลัง</span>
        <div id="count" style="margin-top: 8px; font-size: 15px; color: #00ffcc;"></div>
    </div>

    <script>
        const video = document.getElementById('irisWebcam');
        const canvas = document.getElementById('irisOverlay');
        const statusText = document.getElementById('statusText');
        const dot = document.getElementById('dot');
        const countDisplay = document.getElementById('count');
        const startBtn = document.getElementById('startBtn');
        const context = canvas.getContext('2d');

        let objectDetector = null;
        let isRunning = false;

        async function loadModel() {
            statusText.textContent = "กำลังโหลดโมเดล AI...";
            try {
                objectDetector = await cocoSsd.load();
                statusText.textContent = "โหลดโมเดลสำเร็จ ✓";
                return true;
            } catch (err) {
                statusText.textContent = "โหลดโมเดลล้มเหลว";
                statusText.style.color = "#ff4444";
                return false;
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",   // กล้องหลัง
                        width: 640,
                        height: 480
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve(true);
                    };
                });
            } catch (err) {
                statusText.textContent = "ไม่สามารถเปิดกล้องหลังได้";
                statusText.style.color = "#ff4444";
                return false;
            }
        }

        async function runDetection() {
            if (!objectDetector || !isRunning) return;

            try {
                // ตรวจจับทุกอย่าง โดยลดเกณฑ์ความมั่นใจเหลือ 25%
                const predictions = await objectDetector.detect(video, 0.25);
                
                context.clearRect(0, 0, canvas.width, canvas.height);

                predictions.forEach(prediction => {
                    const [x, y, width, height] = prediction.bbox;
                    const score = Math.round(prediction.score * 100);
                    const label = prediction.class.toUpperCase();

                    // กรอบสวย
                    context.shadowColor = "#00ff88";
                    context.shadowBlur = 15;
                    context.strokeStyle = "#00ff88";
                    context.lineWidth = 4;
                    context.lineJoin = "round";
                    context.strokeRect(x, y, width, height);

                    // ป้ายชื่อ
                    const text = `${label} ${score}%`;
                    context.font = "bold 16px Arial";
                    const textWidth = context.measureText(text).width;

                    const gradient = context.createLinearGradient(x, y-35, x, y-5);
                    gradient.addColorStop(0, "rgba(0, 255, 136, 0.95)");
                    gradient.addColorStop(1, "rgba(0, 180, 90, 0.95)");

                    context.fillStyle = gradient;
                    context.fillRect(x - 2, y - 36, textWidth + 18, 31);

                    context.shadowBlur = 0;
                    context.fillStyle = "#000";
                    context.fillText(text, x + 8, y - 12);
                });

                // แสดงจำนวนวัตถุที่ตรวจพบ
                countDisplay.textContent = `ตรวจพบ ${predictions.length} วัตถุ`;

            } catch (e) {
                console.error(e);
            }

            requestAnimationFrame(runDetection);
        }

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            
            const modelLoaded = await loadModel();
            if (!modelLoaded) return;

            const cameraStarted = await startCamera();
            if (cameraStarted) {
                dot.classList.add('active');
                statusText.textContent = "กำลังตรวจจับทุกอย่าง...";
                statusText.style.color = "#00ff88";
                
                isRunning = true;
                runDetection();
            }
        });

        window.onload = () => {
            statusText.textContent = "กดปุ่มเพื่อเปิดกล้องหลังและตรวจจับทุกอย่าง";
        };
    </script>
</body>
</html>
